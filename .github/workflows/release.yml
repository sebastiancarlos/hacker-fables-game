# Publishes on v* tags. Requires npm trusted publishing for
# sebastiancarlos/hacker-fables-game with this workflow filename.
name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Publish and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      npm_config_loglevel: notice

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test unit and terminal E2E
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Check tag matches package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      - name: Inspect package
        run: npm pack --dry-run

      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub release
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
